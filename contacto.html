<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEODOME | Contacto</title>
    <link rel="icon" href="img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Saira+Stencil+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=12">
</head>
<body class="contact-page">
    <header id="site-header"></header>
    <main class="contact-main">
        <section class="cont">
            <div class="t"><span class="num">/</span><h2>Contacto</h2>
                <p>Hablá con nuestro contacto comercial y recibí información. Elegí el canal que prefieras.</p></div>
            <div class="ccards" id="ccards"></div>
            <p class="who" id="who"></p>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <script src="domos.js?v=12"></script>
    <script>
        montarLayout("contacto");
        $("#ccards").innerHTML = CONFIG.contactos.map(c => `<div class="cc"><small>Contacto comercial</small><b>${c.nombre}</b>
            <a href="https://wa.me/${c.whatsapp}?text=${encodeURIComponent(CONFIG.mensajeGeneral)}" target="_blank" rel="noopener">${c.telefono}</a>
            <a href="mailto:${c.email}">${c.email}</a><span>${c.zona}</span></div>`).join("")
            + `<a class="cc" href="${CONFIG.instagram}" target="_blank" rel="noopener"><small>Instagram</small><b>NEODOME</b></a>`;
        $("#who").textContent = "Contactos comerciales: " + CONFIG.contactos.map(c => c.nombre).join(" y ");
    </script>
</body>
</html>
