<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEODOMOS | Contacto</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=2">
    <style>
        /* La página ocupa como mínimo toda la pantalla y empuja el footer abajo. */
        html, body {
            min-height: 100%;
        }

        body.contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .contact-main {
            flex: 1;
            width: 100%;
            background: #ffffff;
        }

        .contact-main .cont {
            padding-bottom: clamp(48px, 8vh, 100px);
        }

        .contact-main .ccards {
            align-items: stretch;
        }

        .contact-main .cc {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .contact-main .contact-icon {
            width: 30px;
            height: 30px;
            display: block;
            color: var(--verde, #c5d6c3);
        }

        .contact-main .contact-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        body.contact-page footer {
            margin-top: auto;
            width: 100%;
            box-sizing: border-box;
            background: var(--gris, #202428);
            color: #ffffff;
        }
    </style>
</head>
<body class="contact-page">
    <header id="site-header"></header>

    <main class="contact-main">
        <section class="cont">
            <div class="t">
                <h2>Contacto</h2>
                <p>Hablá con un asesor y recibí tu cotización. Elegí el canal que prefieras, te respondemos a la brevedad.</p>
            </div>

            <div class="ccards">
                <a class="cc" href="#" id="whatsapp-link" target="_blank" rel="noopener">
                    <i class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.2 11.7a8.2 8.2 0 0 1-12.1 7.2L3 20l1.2-4.8a8.2 8.2 0 1 1 16-3.5Z"/><path d="M8.6 8.2c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.8 1.8c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .6.5.9 1.2 1.5 2.1 2 .2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.7.8c.3.1.4.3.4.5 0 .3-.2 1.2-.8 1.6-.6.4-1.3.6-2.1.4-1.1-.3-2.4-.9-3.8-2.2-1.1-1-2-2.3-2.2-3.3-.3-.9.1-1.8.8-2.3Z"/></svg></i>
                    <small>WhatsApp</small><b>+54 9 351 399 1739</b>
                </a>

                <a class="cc" href="https://www.instagram.com/neodomos" target="_blank" rel="noopener">
                    <i class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></i>
                    <small>Instagram</small><b>@neodomos</b>
                </a>

                <a class="cc" href="mailto:info@neodomos.com">
                    <i class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></i>
                    <small>Email</small><b>info@neodomos.com</b>
                </a>

                <a class="cc" href="tel:+543513991739">
                    <i class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16.5v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 10.2 18a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 1.9 3.2 2 2 0 0 1 3.9 1h3a2 2 0 0 1 2 1.7l.5 2.7a2 2 0 0 1-.6 1.9L7.5 8.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.9-.6l2.7.5a2 2 0 0 1 1.6 2.3Z"/></svg></i>
                    <small>Teléfono</small><b>+54 9 351 399 1739</b>
                </a>

                <a class="cc" href="https://maps.google.com/?q=C%C3%B3rdoba%2CArgentina" target="_blank" rel="noopener">
                    <i class="contact-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></i>
                    <small>Ubicación</small><b>Córdoba, Argentina</b>
                </a>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="domos.js?v=2"></script>
    <script>
        montarLayout("contacto");
        $("#whatsapp-link").href = wa(CONFIG.mensajeGeneral);
    </script>
</body>
</html>
