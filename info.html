<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEODOMOS | Ficha técnica</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css?v=2">
</head>
<body>

    <header id="site-header"></header>

    <!-- Plantilla: se completa sola según el domo (info.html?id=oficina) -->
    <main class="page on" id="info">
        <div class="ib" id="i-banner">
            <div><small>Ficha técnica</small><h1 id="i-titulo"></h1></div>
        </div>

        <div class="wrap">
            <div class="chips" id="i-chips"></div>
            <p class="lead" id="i-desc"></p>

            <h3>Especificaciones técnicas</h3>
            <div class="specs" id="i-specs"></div>

            <div id="i-modw"><h3>Modelos y variantes</h3><div class="specs" id="i-mod"></div></div>

            <h3>Qué incluye</h3>
            <ul class="inc" id="i-inc"></ul>

            <h3>Galería</h3>
            <div class="gal" id="i-gal"></div>

            <div class="acts">
                <a class="btn btn-v" id="i-wa" target="_blank" rel="noopener">Cotizar este domo</a>
                <a class="btn btn-g" href="index.html">← Volver al inicio</a>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="domos.js?v=2"></script>
    <script>
        montarLayout("info");

        // Lee el domo desde info.html?id=habitacional
        const id = new URLSearchParams(location.search).get("id");
        const n = NODOS.find(x => x.id === id) || NODOS[0];

        document.title = `NEODOMOS | ${n.titulo}`;
        $("#i-banner").style.backgroundImage = `linear-gradient(rgba(20,26,31,.2),rgba(20,26,31,.8)),url('${n.fondo}')`;
        $("#i-titulo").textContent = n.titulo;
        $("#i-desc").textContent = n.descripcion;
        $("#i-chips").innerHTML = NODOS.map(x =>
            `<a href="info.html?id=${encodeURIComponent(x.id)}" class="${x.id === n.id ? "on" : ""}">${icono(x.icono)} ${x.nombre}</a>`).join("");

        // Siempre muestra todas las filas de SPECS_BASE; las que faltan dicen "A confirmar"
        $("#i-specs").innerHTML = SPECS_BASE.map(l =>
            `<div><small>${l}</small><b>${n.specs[l] || "A confirmar"}</b></div>`).join("");

        // Modelos y variantes: solo aparece si el domo tiene "modelos" en domos.js
        $("#i-modw").style.display = n.modelos ? "" : "none";
        $("#i-mod").innerHTML = (n.modelos || []).map(m => `<div><small>${m[1]}</small><b>${m[0]}</b></div>`).join("");

        $("#i-inc").innerHTML = n.incluye.map(i => `<li>${i}</li>`).join("");
        $("#i-gal").innerHTML = n.galeria.map(g => `<img src="${g}" alt="${n.titulo}">`).join("");
        $("#i-wa").href = wa(`Hola! Quiero cotizar el ${n.titulo}.`);
    </script>
</body>
</html>
